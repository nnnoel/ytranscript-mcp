name: Release

# Publishes to npm, then to the MCP registry, when a version tag is pushed. See RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing and the MCP registry both sign in with GitHub's
      # identity for this workflow, so no token is stored.
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
      # Pinned release of the registry's publishing tool, checked against its SHA-256.
      # To upgrade, change both values together from
      # https://github.com/modelcontextprotocol/registry/releases
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships with.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the tag, package.json, server.json, source and changelog agree
        run: node scripts/version.mjs check "$TAG"
      - run: npm ci
      - name: Publish to npm
        run: |
          if [ -n "$(npm view "ytranscript-mcp@${TAG#v}" version 2>/dev/null)" ]; then
            echo "ytranscript-mcp@${TAG#v} is already on npm. Nothing to publish."
          else
            npm publish
          fi
      - name: Wait for npm to serve the new version
        # The MCP registry reads the package from npm, which takes about a minute to show it.
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null "https://registry.npmjs.org/ytranscript-mcp/${TAG#v}"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::ytranscript-mcp@${TAG#v} did not appear on npm within 5 minutes."
          exit 1
      - name: Publish to the MCP registry
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
